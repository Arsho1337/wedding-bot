services:
  - type: worker
    name: wedding-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: data/bot.db
      - key: TZ_NAME
        value: Asia/Tehran
      - key: PROXY_URL
        sync: false
    # Optional: persistent disk for SQLite database
    disk:
      name: wedding-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1